name: AWS K3s CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: aws-k3s-cicd
  K3S_SERVER_INSTANCE_ID: i-0f49272e526bbdf14

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::926909119009:role/GitHubActionsK3sDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            ./aws-k3s-cicd

      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to K3s using SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ env.K3S_SERVER_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "AWS_PASSWORD=$(aws ecr get-login-password --region ap-south-1)",
              "sudo k3s kubectl create secret docker-registry ecr-registry-secret --docker-server=926909119009.dkr.ecr.ap-south-1.amazonaws.com --docker-username=AWS --docker-password=\"$AWS_PASSWORD\" --dry-run=client -o yaml | sudo k3s kubectl apply -f -",
              "sudo k3s kubectl set image deployment/aws-k3s-cicd aws-k3s-cicd=926909119009.dkr.ecr.ap-south-1.amazonaws.com/aws-k3s-cicd:${{ github.sha }}",
              "sudo k3s kubectl rollout status deployment/aws-k3s-cicd --timeout=180s"
            ]'